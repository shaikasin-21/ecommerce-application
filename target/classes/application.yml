server:
  port: 8080

spring:
  application:
    name: ecommerce-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
  # Email: set SPRING_MAIL_HOST / SPRING_MAIL_PORT / SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD
  # to send real emails. Without a host, order confirmations are only logged.

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-long-random-string-min-32-chars}
    expiration-ms: 86400000
  admin:
    email: ${ADMIN_EMAIL:admin@shop.com}
    password: ${ADMIN_PASSWORD:Admin@12345}
  seed-demo: ${SEED_DEMO:true}
  payment:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:whsec_test_secret}
  mail:
    from: ${MAIL_FROM:no-reply@shop.local}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
